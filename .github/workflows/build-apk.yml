name: Build HiChord Pocket APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real DSP core with ThreadSanitizer
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake -S tests -B build/dsp-tests -DENABLE_TSAN=ON
          cmake --build build/dsp-tests
          ctest --test-dir build/dsp-tests --output-on-failure

  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4

      - name: Install Exact NDK and CMake Components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK (Kotlin + C++ Oboe DSP)
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiChordPocket-StageA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM for Android instrumentation
        run: sudo chmod 666 /dev/kvm

      - name: Test multitouch, joystick and Oboe on Android 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StageA-test-reports
          path: app/build/reports/
